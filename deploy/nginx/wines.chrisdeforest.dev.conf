# wines.chrisdeforest.dev: VinoScope.
# Installed by deploy/install.sh to /etc/nginx/sites-available/. Edit it in the repo, not on the Pi.
#
# Relies on files that already exist on the Pi:
#   conf.d/cloudflare-realip.conf     real visitor IP behind Cloudflare (so the limits below are per visitor)
#   conf.d/fail2ban-deny.conf         fail2ban's ban list (applies to every site)
#   conf.d/static-cache-control.conf  the $static_cache_control map used by snippets/cache-static.conf
#   snippets/ssl-params.conf          TLS settings

# ---- Rate limits (per real visitor IP) -------------------------------------------------
# Catalogue reads: search, filters, facets, wine pages. Generous, so typing in search feels instant.
limit_req_zone $binary_remote_addr zone=wines_api:10m rate=10r/s;
# Discover / Pair quiz submissions. Each one runs a scoring query, so they're slower.
limit_req_zone $binary_remote_addr zone=wines_reco:10m rate=1r/s;
# Anything that changes data (admin edits). An empty key is not counted, so GETs pass freely.
map $request_method $wines_write_key {
    GET     "";
    HEAD    "";
    OPTIONS "";
    default $binary_remote_addr;
}
limit_req_zone $wines_write_key zone=wines_write:10m rate=30r/m;
# Admin-only reads (stats). Slows down anyone guessing the admin key.
limit_req_zone $binary_remote_addr zone=wines_admin:10m rate=30r/m;

# ---- Short cache for catalogue reads -----------------------------------------------------
# The catalogue only changes through admin edits, so repeated searches (and bots) are answered
# by nginx for up to 60 s instead of reaching Postgres. An admin edit can take up to a minute
# to appear for visitors; requests carrying the admin key always skip the cache.
proxy_cache_path /var/cache/nginx/vinoscope levels=1:2 keys_zone=vinoscope_api:10m max_size=100m inactive=10m use_temp_path=off;

upstream vinoscope_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

# ---- HTTP: Let's Encrypt challenges, everything else to HTTPS ----------------------------
server {
    listen 80;
    listen [::]:80;
    server_name wines.chrisdeforest.dev;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS -----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wines.chrisdeforest.dev;

    ssl_certificate /etc/letsencrypt/live/wines.chrisdeforest.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wines.chrisdeforest.dev/privkey.pem;
    include snippets/ssl-params.conf;

    root /home/chris/vinoscope/frontend/dist;
    index index.html;

    # Security headers. Server level ONLY: an add_header inside a location would cancel all of
    # these for that location (that's how the portfolio lost its headers; see ~/notes/portfolio/02).
    # CSP: this site, Google Analytics and Cloudflare Web Analytics only; no inline scripts;
    # Trusted Types with the single google-analytics policy (frontend/src/utils/analytics.ts).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://static.cloudflareinsights.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://cloudflareinsights.com; img-src 'self' data: https://*.google-analytics.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'; upgrade-insecure-requests; require-trusted-types-for 'script'; trusted-types google-analytics" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(),microphone=(),camera=(),payment=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    # HIT / MISS / BYPASS for cached API responses (empty, so not sent, for everything else)
    add_header X-Cache-Status $upstream_cache_status always;

    client_max_body_size 16k;
    client_body_timeout 10s;
    keepalive_timeout 15;
    limit_req_status 429;

    access_log /var/log/nginx/wines_access.log;
    error_log  /var/log/nginx/wines_error.log;

    # The app. /wines/<id> is an app page, /wines/<slug>.webp a bottle photo: try_files serves
    # a real file when there is one and the app otherwise.
    location / {
        try_files $uri /index.html;
    }

    location ~* \.map$ { return 404; }
    location ~ /\. { deny all; }

    # ---- API ----
    location /api/ {
        limit_req zone=wines_api burst=20 nodelay;
        limit_req zone=wines_write burst=10 nodelay;

        proxy_cache vinoscope_api;
        proxy_cache_valid 200 60s;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_502 http_503;
        proxy_cache_bypass $http_x_admin_key;
        proxy_no_cache $http_x_admin_key;

        include snippets/vinoscope-proxy.conf;
    }

    location = /api/recommendations {
        limit_req zone=wines_reco burst=5 nodelay;
        include snippets/vinoscope-proxy.conf;
    }

    location /api/admin/ {
        limit_req zone=wines_admin burst=10 nodelay;
        limit_req zone=wines_write burst=10 nodelay;
        include snippets/vinoscope-proxy.conf;
    }

    include snippets/cache-static.conf;
}
