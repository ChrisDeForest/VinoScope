services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: vinoscope
      POSTGRES_PASSWORD: vinoscope
      POSTGRES_DB: vinoscope
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db-init/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql

volumes:
  pgdata:
